services:

  api:
    build: ./app
    env_file:
      - .env
    restart: unless-stopped

  bot:
    build: ./bot
    env_file:
      - .env
    depends_on:
      - api
      - redis
    restart: unless-stopped

  redis:
    image: redis:7
    env_file:
      - .env
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data: