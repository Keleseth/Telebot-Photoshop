<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Выбор цвета</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root { --pad: 16px; }
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: var(--pad); }
    #picker { margin-bottom: 12px; }
    button { padding: 10px 14px; border-radius: 10px; border: 0; cursor: pointer; background:#111827; color:#fff; font-weight:600; }
    .color-input { width: 48px; height: 48px; border: 2px solid #e5e7eb; border-radius: 9999px; padding:0; appearance: none; background: none; }
    .color-input::-webkit-color-swatch-wrapper { padding:0; border-radius: 9999px; }
    .color-input::-webkit-color-swatch { border: none; border-radius: 9999px; }
  </style>
  <script src="https://cdn.jsdelivr.net/npm/iro@5.5.3/dist/iro.min.js"></script>
</head>
<body>
  <h3>Выберите цвет</h3>
  <div id="picker"></div>
  <button id="useBtn">Подтвердить</button>

  <script>
    const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();
    const $pickerWrap = document.getElementById('picker');
    const $btn = document.getElementById('useBtn');

    let current = { hex: '#FF69B4', rgb: { r:255, g:105, b:180, value:'rgb(255, 105, 180)' } };

    function setCurrent(hex) {
      const m = hex.replace('#','');
      const r = parseInt(m.slice(0,2),16),
            g = parseInt(m.slice(2,4),16),
            b = parseInt(m.slice(4,6),16);
      current = { hex, rgb: { r, g, b, value: `rgb(${r}, ${g}, ${b})` } };
    }

    function attachButton() {
      $btn.onclick = () => {
        tg?.sendData(JSON.stringify({ type:'single_color', ...current }));
        tg?.close();
      };
    }

    function initFallbackInput() {
      $pickerWrap.innerHTML = '<input type="color" id="fallbackColor" class="color-input" value="#FF69B4">';
      const input = document.getElementById('fallbackColor');
      setCurrent(input.value);
      input.addEventListener('input', e => setCurrent(e.target.value));
      attachButton();
    }

    function initIro() {
      try {
        const picker = new window.iro.ColorPicker('#picker', {
          width: Math.min(window.innerWidth - 2*16, 320),
          color: '#FF69B4',
          borderWidth: 1,
          borderColor: '#e5e7eb',
          layout: [
            { component: iro.ui.Wheel },
            { component: iro.ui.Slider, options: { sliderType: 'value' } },
            { component: iro.ui.Slider, options: { sliderType: 'saturation' } }
          ]
        });
        function update(c){
          const hex = c.hexString; const {r,g,b} = c.rgb;
          current = { hex, rgb: { r,g,b, value: `rgb(${r}, ${g}, ${b})` } };
        }
        update(picker.color);
        picker.on('color:change', update);
        attachButton();
      } catch {
        initFallbackInput();
      }
    }

    if (window.iro) initIro(); else initFallbackInput();
  </script>
</body>
</html>
