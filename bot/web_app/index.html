<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Color Wheel Picker</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 16px; }
    #picker { margin-bottom: 16px; }
    #swatch { width: 40px; height: 40px; border:1px solid #ccc; display:inline-block; vertical-align:middle; border-radius: 6px;}
    button { padding: 10px 14px; border-radius: 8px; background:#111827; color:#fff; border:0; cursor:pointer; }
  </style>
</head>
<body>
  <h3>Pick a color</h3>
  <div id="picker"></div>
  <div>
    <div id="swatch"></div>
    <span>HEX: <code id="hex">#0047AB</code></span>
    <span>RGB: <code id="rgb">rgb(0,71,171)</code></span>
  </div>
  <div style="margin-top:16px;">
    <button id="useBtn">Use this color</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp; tg?.ready(); tg?.expand();

    const $hex = document.getElementById('hex');
    const $rgb = document.getElementById('rgb');
    const $swatch = document.getElementById('swatch');
    const $pickerWrap = document.getElementById('picker');
    const $btn = document.getElementById('useBtn');

    let current = { hex: '#0047AB', rgb: { r:0, g:71, b:171, value:'rgb(0,71,171)' } };

    function setCurrent(hex) {
      const m = hex.replace('#','');
      const r = parseInt(m.slice(0,2),16), g = parseInt(m.slice(2,4),16), b = parseInt(m.slice(4,6),16);
      current = { hex, rgb: { r, g, b, value: `rgb(${r}, ${g}, ${b})` } };
      $hex.textContent = current.hex;
      $rgb.textContent = current.rgb.value;
      $swatch.style.background = current.hex;
    }

    function attachButton() {
      $btn.onclick = () => {
        tg?.sendData(JSON.stringify({ type:'single_color', ...current }));
        tg?.close();
      };
    }

    function initFallbackInput() {
      $pickerWrap.innerHTML = '<input type="color" id="fallbackColor" value="#0047AB">';
      const input = document.getElementById('fallbackColor');
      setCurrent(input.value);
      input.addEventListener('input', e => setCurrent(e.target.value));
      attachButton();
    }

    function initIro() {
      try {
        const picker = new window.iro.ColorPicker('#picker', {
          width: Math.min(window.innerWidth - 32, 320),
          color: '#0047AB',
          borderWidth: 1,
          borderColor: '#e5e7eb'
        });
        function update(c){
          const hex = c.hexString, rgbStr = c.rgbString;
          const {r,g,b} = c.rgb;
          current = { hex, rgb: { r,g,b, value: rgbStr } };
          $hex.textContent = hex; $rgb.textContent = rgbStr; $swatch.style.background = hex;
        }
        update(picker.color);
        picker.on('color:change', update);
        attachButton();
      } catch (e) {
        initFallbackInput();
      }
    }

    // Загружаем iro.js с CDN и только потом инициализируем
    (function loadIro(){
      if (window.iro) { initIro(); return; }
      const s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/iro@5.5.3/dist/iro.min.js';
      s.onload = () => initIro();
      s.onerror = () => initFallbackInput();
      document.head.appendChild(s);
    })();

  </script>
</body>
</html>
