name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:

jobs:

  lint-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ bot, app ]
    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.3"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          pip install -r ${{ matrix.service }}/requirements.txt
          # pip install ruff pytest

  docker-build:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker images

        run: |
          docker build -t telebot-bot:ci ./bot
          docker build -t telebot-api:ci ./app

  docker-push:
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and Push images
        run: |
          IMAGE_BOT=${{ secrets.DOCKERHUB_USERNAME }}/telebot-bot  # user/telebot-bot
          IMAGE_API=${{ secrets.DOCKERHUB_USERNAME }}/telebot-api  # user/telebot-api
          TAG=${{ github.sha }}

          docker build -t $IMAGE_BOT:$TAG ./bot
          docker build -t $IMAGE_API:$TAG ./app

          if [ "${{ github.ref_name }}" = "main" ]; then
            docker tag $IMAGE_BOT:$TAG $IMAGE_BOT:latest
            docker tag $IMAGE_API:$TAG $IMAGE_API:latest
          fi

          docker push $IMAGE_BOT --all-tags
          docker push $IMAGE_API --all-tags

  deploy:
    runs-on: ubuntu-latest
    needs: docker-push
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ${{ secrets.SERVER_PROJECT_DIR }}
            docker compose pull
            docker compose up -d