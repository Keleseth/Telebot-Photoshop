services:

  api:
    image: keleseth/telebot-api:latest
    env_file:
      - .env
    restart: unless-stopped

  bot:
    image: keleseth/telebot-bot:latest
    env_file:
      - .env
    depends_on:
      - api
      - redis
    restart: unless-stopped

  redis:
    image: redis:7
    env_file:
      - .env
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:
